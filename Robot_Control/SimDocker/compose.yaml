services:
  # 4. CoppeliaSim
  coppeliasim:
    image: coppeliasim-ubuntu24
    container_name: coppelia_container
    entrypoint: /opt/CoppeliaSim_Edu_V4_9_0_rev6_Ubuntu24_04/coppeliaSim
    command: ["-GpreferredSandboxLang=python", "-f/shared/piper_robot_sample.ttt", "-s0"]
    ports:
      - "23000-23500:23000-23500"
    volumes:
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      - ${HOME}/.CoppeliaSim:${HOME}/.CoppeliaSim
      - ../Sim:/shared:ro
      - /tmp/.X11-unix:/tmp/.X11-unix
    working_dir: /shared
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - QT_QPA_PLATFORM=xcb
      - LIBGL_ALWAYS_SOFTWARE=1
      - DISPLAY=${DISPLAY}
    # ▼ 追加: 23000番ポートが開放されたかを監視するヘルスチェック
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/23000"]
      interval: 3s     # 3秒ごとにチェック
      timeout: 2s      # 2秒でタイムアウト
      retries: 10      # 最大10回試行（約30秒）
      start_period: 5s # 起動後5秒間は猶予期間とする

  # 5. MQTT_teleoperation
  teleoperation:
    image: python:3.11-slim
    container_name: mqtt_teleoperation_sim
    # ▼ 追加: coppeliasim のヘルスチェックが合格(healthy)になってから起動する依存関係
    depends_on:
      coppeliasim:
        condition: service_healthy
    volumes:
      - ..:/app:ro
      - python_packages:/usr/local/lib/python3.11/site-packages
    working_dir: /app
    environment:
      - ROBOT_TYPE="${ROBOT_TYPE}"
      - ROBOT_UUID="${ROBOT_UUID}"
      - MQTT_BROKER="${MQTT_BROKER}"
      - PYTHONUNBUFFERED=1
    # 「echo wait 10s && sleep 10」を削除し、インストール後すぐに実行できるように修正
    command: ["-c", "pip install -r requirements.txt && python3 MQTT_teleoperation_rl.py --simulation --coppelia_host=coppeliasim --right_arm --host=${MQTT_BROKER}"]
    entrypoint: /usr/bin/bash

volumes:
  python_packages:
    driver: local
