# run.shを使用してcomposeを起動する。
# run.shは、UIDとGIDを設定、ユーザー所有のホスト鍵を適切にコピー
# trap EXITで、コピーした鍵を削除する。
---
services:
  # 1. ブローカー (Mosquitto)
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mqtt_broker
    ports:
      - "8883:8883"
      - "8333:8333"
      - "8083:8083"
      # - "1883:1883"
      # - "9001:9001" # WSS用ポート
    volumes:
      - ../Mosquitto/config:/mosquitto/config
      - ../Mosquitto/data:/mosquitto/data
      - ../Mosquitto/log:/mosquitto/log
    working_dir: /mosquitto
    command: sh -c "mosquitto -c ./config/mosquitto-container.conf"
    user: "${UID:-1000}:${GID:-1000}" # run.shでUIDとGIDを設定している場合はそれを使用
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 3 localhost 8333 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  # 2. Python MQTT クライアント 
  python-client:
    image: python:3.11-slim
    container_name: metawork_mqtt_manager
    volumes:
      - ../Mosquitto/MetaworkMQTT/:/app
      - ../Robot_Control/MQTT/rootCA.pem:/app/rootCA.pem:ro
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      - ${HOME}
    working_dir: /app
    depends_on:
      mosquitto:
        condition: service_healthy
    # command: sh -c "[ -f requirements.txt ] && pip install -r requirements.txt; python ....
    # command: sh -c "pip install paho-mqtt && python MetaworkMQTT.py --wss --host host.docker.internal --port 8083"
    command: ["-c", "pip install paho-mqtt && python3 MetaworkMQTT.py --wss --host mosquitto" ]
    # command: [ "-c", "sleep 10000" ]
    entrypoint: /usr/bin/bash
    # 現在は、client.tls_set(cert_reqs=0)としてあるのでmosquittoの証明書を使用しないが...
    # localhostでもMan-in-the-Middle攻撃を防ぐために、証明書を使用するように変更することを推奨。
    # user: "${UID:-1000}:${GID:-1000}"
    environment:
      - MQTT_BROKER_HOST=host.docker.internal
      - PYTHONUNBUFFERED=1

  # 3. Next.js 開発サーバー
  nextjs-dev:
    image: node:22-alpine
    container_name: nextjs_dev_https_server
    ports:
      - "3000:3000"
    volumes:
      - ..:/app
      - liu-teleop-node-modules:/app/node_modules
      - /app/.next
      - /app/.pnpm-store
    working_dir: /app
    command: sh -c "corepack enable pnpm && pnpm install && pnpm dev-mkcert"
    # user: "${UID:-1000}:${GID:-1000}"
    environment:
      - WATCHPACK_POLLING=true

volumes:
  liu-teleop-node-modules:
