listener 8883
protocol websockets
cafile ./config/certs/rootCA.pem
certfile ./config/certs/localcerts.pem
keyfile ./config/certs/localcerts-key.pem
allow_anonymous true

listener 8333
protocol websockets
cafile ./config/certs/rootCA.pem
certfile ./config/certs/localcerts.pem
keyfile ./config/certs/localcerts-key.pem
allow_anonymous true

listener 8083
protocol websockets
cafile ./config/certs/rootCA.pem
certfile ./config/certs/localcerts.pem
keyfile ./config/certs/localcerts-key.pem
allow_anonymous true

# for healthcheck inside the bridge network only
listener 1883
protocol mqtt
allow_anonymous true

log_type error
log_type warning
# log_type notice
log_type subscribe
# log_type information
